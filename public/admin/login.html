<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>크리너리 관리자 로그인</title>
<style>
:root{--navy:#0f2a4a;--teal:#14a3a3;--bg:#f4f7fa;--text:#16202c;--muted:#5b6b7c;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 8px 30px rgba(15,42,74,.12)}
h1{margin:0 0 4px;font-size:22px;color:var(--navy)}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;height:48px;border:1px solid #cfd8e3;border-radius:10px;padding:0 12px;font-size:16px}
input:focus{outline:2px solid var(--teal);border-color:var(--teal)}
button{margin-top:22px;width:100%;height:50px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:22px;margin-top:14px;color:var(--err);font-size:14px}
a.home{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>크리너리 관리자</h1>
  <p class="sub">예약·상담내역·견적 프로그램은 관리자만 볼 수 있습니다.</p>
  <form id="f" autocomplete="on">
    <label for="u">아이디</label>
    <input id="u" name="username" autocomplete="username" required value="admin">
    <label for="p">비밀번호</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">로그인</button>
    <div id="msg" role="alert"></div>
  </form>
  <a class="home" href="/">홈페이지로</a>
</main>
<script>
(function(){
  var next = new URLSearchParams(location.search).get('next') || '/admin/reservations';
  if (!/^\/admin\/[a-z]+$/.test(next)) next = '/admin/reservations';
  var f = document.getElementById('f'), b = document.getElementById('b'), msg = document.getElementById('msg');
  fetch('/api/admin?action=me').then(function(r){ return r.json(); }).then(function(d){
    if (d.ok) location.replace(next);
    else if (d.configured === false) msg.textContent = '관리자 로그인이 아직 설정되지 않았습니다(서버 설정 필요).';
  }).catch(function(){});
  f.addEventListener('submit', function(e){
    e.preventDefault();
    b.disabled = true; msg.textContent = '';
    fetch('/api/admin?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Cleanery-Admin': '1' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    }).then(function(r){ return r.json().then(function(d){ return { r: r, d: d }; }); }).then(function(x){
      if (x.d.ok) location.replace(next);
      else { msg.textContent = x.d.error || '로그인하지 못했습니다.'; b.disabled = false; }
    }).catch(function(){ msg.textContent = '서버에 연결하지 못했습니다.'; b.disabled = false; });
  });
})();
</script>
</body>
</html>
