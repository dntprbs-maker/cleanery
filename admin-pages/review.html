<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>크리너리 가상 상담 검토</title>
<script src="/assets/admin-nav.js"></script>
<style>
:root{--navy:#0f2a4a;--teal:#14a3a3;--bg:#f4f7fa;--card:#fff;--text:#16202c;--muted:#5b6b7c;--line:#e1e7ee;--blue:#1d4ed8;--amber:#b45309;--red:#b42318;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:20px;margin:4px 0 8px;color:var(--navy)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;background:#e0f2f1}
.banner.warn{background:#fef3c7;color:#7c2d12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat{background:#fff;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--text)}
.progress{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--teal)}
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:10px}
.filters input,.filters select{font:inherit;min-height:44px;border:1px solid #cfd8e3;border-radius:10px;padding:0 10px;width:100%}
.filters .full{grid-column:1/-1}
label.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px}
label.chk input{width:20px;height:20px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tools a,.tools button,.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #cfd8e3;background:#fff;color:var(--navy);font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.list .item{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;cursor:pointer;box-shadow:0 1px 4px rgba(15,42,74,.06)}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .title{font-weight:700}
.meta{font-size:13px;color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.s-미검토{background:#eef1f4;color:#4b5563}.s-수정\ 중{background:#dbeafe;color:var(--blue)}.s-검토\ 완료{background:#dcfce7;color:var(--green)}
.s-보류{background:#fef3c7;color:var(--amber)}.s-기준\ 반영\ 완료{background:#ede9fe;color:#6d28d9}
#detail[hidden],#listView[hidden]{display:none}
.back{margin-bottom:10px}
.case-head{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.case-head h2{font-size:18px;margin:0 0 4px}
.situation{font-size:14px;margin:6px 0 0}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.turn{max-width:88%;border-radius:14px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;position:relative}
.turn.customer{background:#fff;border:1px solid var(--line);align-self:flex-start}
.turn.staff{background:#e3f2ff;align-self:flex-end}
.script .turn{max-width:100%;align-self:stretch;border-radius:8px}
.script .turn .who{font-weight:700;margin-right:6px}
.who{font-size:12px;color:var(--muted);display:block}
.turn .orig{color:#9aa5b1;text-decoration:line-through;font-size:14px;display:block;margin-bottom:4px}
.turn .edited-mark{color:var(--blue);font-size:12px;font-weight:700}
.turn .note{display:block;color:var(--amber);font-size:13px;margin-top:4px}
.turn .edit-btn{margin-top:6px;border:0;background:transparent;color:var(--blue);font:inherit;font-size:14px;padding:4px 0;cursor:pointer;min-height:32px}
.turn textarea,.case-note{width:100%;font:inherit;border:1px solid #9ec5ff;border-radius:8px;padding:8px;min-height:90px}
.turn input.reason{width:100%;font:inherit;font-size:14px;border:1px solid #cfd8e3;border-radius:8px;padding:6px 8px;margin-top:6px;min-height:40px}
.box{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.box h3{font-size:15px;margin:0 0 6px}
.box ul{margin:0;padding-left:18px;font-size:14px}
.policy li{color:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:40}
.savebar select{font:inherit;min-height:46px;border:1px solid #cfd8e3;border-radius:10px;padding:0 8px;flex:1}
.savebar .btn.primary{min-height:46px;padding:0 20px}
.msg{font-size:13px;min-height:18px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.hist li{margin-bottom:6px}
@media(min-width:760px){.stats{grid-template-columns:repeat(6,1fr)}.filters{grid-template-columns:2fr 1fr 1fr 1fr}.filters .full{grid-column:auto}.savebar{left:50%;transform:translateX(-50%);max-width:980px;border-radius:12px 12px 0 0}}
</style>
</head>
<body>
<main>
  <h1>가상 상담 검토</h1>
  <div id="storage" class="banner"></div>
  <section id="listView">
    <div class="stats" id="stats"></div>
    <div class="progress" aria-label="검토 진행률"><i id="bar" style="width:0"></i></div>
    <div class="filters">
      <input id="q" type="search" placeholder="번호·제목·내용 검색" aria-label="검색">
      <select id="fCat" aria-label="분류"><option value="">전체 분류</option></select>
      <select id="fStatus" aria-label="검토 상태"><option value="">전체 상태</option></select>
      <label class="chk full"><input type="checkbox" id="onlyTodo"> 미검토만 보기</label>
    </div>
    <div class="tools">
      <a href="/api/review?action=export&format=docx">DOCX 전체</a>
      <a href="/api/review?action=export&format=csv">CSV 전체</a>
      <a href="/api/review?action=export&format=json">JSON 전체(백업)</a>
      <a href="/api/review?action=export&format=docx&only=approved">검토 완료만 DOCX</a>
      <a href="/api/review?action=export&format=csv&only=approved">검토 완료만 CSV</a>
      <a href="/api/review?action=standards&format=docx">상담 기준 후보(DOCX)</a>
      <a href="/api/review?action=standards&format=md">상담 기준 후보(MD)</a>
      <label class="btn" for="importFile">JSON 가져오기</label><input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="meta" id="count"></p>
    <div class="list" id="list"></div>
  </section>

  <section id="detail" hidden>
    <button class="btn back" type="button" id="backBtn">← 목록으로</button>
    <div class="case-head" id="caseHead"></div>
    <div id="convo"></div>
    <div class="box"><h3>상담 결과</h3><div id="outcome"></div></div>
    <div class="box"><h3>주의할 점</h3><ul id="cautions"></ul></div>
    <div class="box policy" id="policyBox"><h3>정책 확인 필요</h3><ul id="policy"></ul></div>
    <div class="box"><h3>아빠 메모(사례 전체)</h3><textarea class="case-note" id="caseNote" placeholder="이 사례에 대한 메모"></textarea></div>
    <div class="box"><h3>이전 버전</h3><ul class="hist" id="hist"></ul></div>
  </section>
</main>

<div class="savebar" id="savebar" hidden>
  <select id="status" aria-label="검토 상태"></select>
  <button class="btn primary" type="button" id="saveBtn">저장</button>
</div>
<div class="savebar" id="msgbar" hidden style="bottom:70px;border:0;background:transparent;padding:0 12px"><span class="msg" id="msg"></span></div>

<script>
(function(){
  var items = [], statuses = [], current = null, dirty = false;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function when(s){ return s ? new Date(s).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'; }
  function api(url, opt){
    opt = opt || {};
    if (opt.body && typeof opt.body !== 'string') { opt.body = JSON.stringify(opt.body); }
    opt.headers = Object.assign({ 'Content-Type': 'application/json', 'X-Cleanery-Admin': '1' }, opt.headers || {});
    return fetch(url, opt).then(function(r){ return r.json().then(function(d){ d.__status = r.status; return d; }); });
  }
  function msg(t, kind){ $('msgbar').hidden = !t; $('msg').className = 'msg ' + (kind || ''); $('msg').textContent = t || ''; }

  function loadList(){
    return api('/api/review?action=list').then(function(d){
      items = d.items; statuses = d.statuses;
      var st = d.storage || {}; $('storage').textContent = st.message || ''; $('storage').className = 'banner' + (st.durable ? '' : ' warn');
      var s = d.stats;
      $('stats').innerHTML = [['전체', s.total], ['미검토', s['미검토']], ['수정 중', s['수정 중']], ['검토 완료', s['검토 완료']], ['보류', s['보류']], ['기준 반영', s['기준 반영 완료']]]
        .map(function(x){ return '<div class="stat"><b>' + x[1] + '</b>' + x[0] + '</div>'; }).join('');
      $('bar').style.width = s.progressPercent + '%';
      $('bar').parentNode.title = '검토 진행률 ' + s.progressPercent + '%';
      if ($('fCat').options.length === 1) {
        Array.from(new Set(items.map(function(i){ return i.category; }))).forEach(function(c){ $('fCat').add(new Option(c, c)); });
        statuses.forEach(function(x){ $('fStatus').add(new Option(x, x)); $('status').add(new Option(x, x)); });
      }
      renderList();
    });
  }

  function renderList(){
    var q = $('q').value.trim().toLowerCase(), cat = $('fCat').value, st = $('fStatus').value, todo = $('onlyTodo').checked;
    var rows = items.filter(function(i){
      if (cat && i.category !== cat) return false;
      if (st && i.status !== st) return false;
      if (todo && i.status !== '미검토') return false;
      if (q && (String(i.no) + ' ' + i.title + ' ' + i.category).toLowerCase().indexOf(q) < 0 && ('#' + i.no) !== q) return false;
      return true;
    });
    $('count').textContent = rows.length + '건 표시';
    $('list').innerHTML = rows.map(function(i){
      return '<button class="item" type="button" data-id="' + i.id + '"><div class="top"><span class="title">' + String(i.no).padStart(3, '0') + '. ' + esc(i.title) + '</span><span class="badge s-' + esc(i.status) + '">' + esc(i.status) + '</span></div>' +
        '<div class="meta">' + esc(i.category) + ' · ' + esc(i.channel) + ' · 난이도 ' + esc(i.difficulty) + (i.edited ? ' · 수정 ' + i.edited + '곳' : '') + (i.policy ? ' · 정책확인 ' + i.policy : '') + '</div></button>';
    }).join('') || '<p class="meta">조건에 맞는 사례가 없습니다.</p>';
  }

  function openCase(id, push){
    return api('/api/review?action=case&id=' + encodeURIComponent(id)).then(function(d){
      if (d.__status !== 200) { alert(d.error || '불러오지 못했습니다.'); return; }
      current = d; dirty = false;
      $('listView').hidden = true; $('detail').hidden = false; $('savebar').hidden = false; msg('');
      if (push !== false) history.pushState({ id: id }, '', '#' + id);
      renderCase();
      window.scrollTo(0, 0);
    });
  }

  function renderCase(){
    var c = current.case, s = current.state;
    $('caseHead').innerHTML = '<h2>' + String(c.no).padStart(3, '0') + '. ' + esc(c.title) + '</h2><div class="meta">' + esc(c.category) + ' · ' + esc(c.channel) + ' 상담 · 난이도 ' + esc(c.difficulty) + ' · 버전 ' + s.version + (s.updatedAt ? ' · 마지막 저장 ' + when(s.updatedAt) + ' (' + esc(s.updatedBy) + ')' : '') + '</div><p class="situation">' + esc(c.situation) + '</p>';
    var script = c.channel === '전화';
    $('convo').className = 'chat' + (script ? ' script' : '');
    $('convo').innerHTML = current.turns.map(function(t){
      var who = t.speaker === 'staff' ? '상담직원' : '고객';
      var inner = (script ? '<span class="who">' + who + '</span>' : '<span class="who">' + who + '</span>') +
        (t.edited ? '<span class="orig">' + esc(t.original) + '</span><span class="edited-mark">수정본</span> ' : '') +
        '<span class="text">' + esc(t.final) + '</span>' +
        (t.note ? '<span class="note">수정 이유: ' + esc(t.note) + '</span>' : '') +
        (t.speaker === 'staff' ? '<br><button type="button" class="edit-btn" data-tid="' + t.id + '">✎ 답변 수정</button>' : '');
      return '<div class="turn ' + t.speaker + '" data-tid="' + t.id + '">' + inner + '</div>';
    }).join('');
    $('outcome').textContent = c.outcome;
    $('cautions').innerHTML = c.cautions.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('');
    $('policyBox').hidden = !c.policy.length;
    $('policy').innerHTML = c.policy.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('');
    $('caseNote').value = s.caseNote || '';
    $('status').value = s.status;
    $('hist').innerHTML = current.history.length ? current.history.map(function(h){
      return '<li>버전 ' + h.version + ' · ' + esc(h.status) + ' · 수정 ' + h.edited + '곳 · ' + when(h.updatedAt) + ' (' + esc(h.updatedBy || '-') + ') <button class="btn" type="button" data-restore="' + h.version + '">이 버전으로 복원</button></li>';
    }).join('') : '<li class="meta">아직 이전 버전이 없습니다(두 번째 저장부터 쌓입니다).</li>';
  }

  $('convo').addEventListener('click', function(e){
    var tid = e.target.getAttribute('data-tid'); if (!tid || !e.target.classList.contains('edit-btn')) return;
    var el = e.target.closest('.turn'); var t = current.turns.filter(function(x){ return x.id === tid; })[0];
    el.innerHTML = '<span class="who">상담직원 답변 수정 (원본: ' + esc(t.original) + ')</span><textarea data-edit="' + tid + '">' + esc(t.final) + '</textarea>' +
      '<input class="reason" data-note="' + tid + '" placeholder="수정 이유/메모(선택)" value="' + esc(t.note) + '">';
    el.querySelector('textarea').focus(); dirty = true; msg('수정 중 — 아래 [저장]을 눌러야 서버에 저장됩니다.');
  });
  $('caseNote').addEventListener('input', function(){ dirty = true; msg('수정 중 — [저장]을 눌러야 저장됩니다.'); });
  $('status').addEventListener('change', function(){ dirty = true; });

  $('saveBtn').addEventListener('click', function(){
    var edits = {}, notes = {};
    document.querySelectorAll('[data-edit]').forEach(function(t){ edits[t.getAttribute('data-edit')] = t.value; });
    document.querySelectorAll('[data-note]').forEach(function(t){ notes[t.getAttribute('data-note')] = t.value; });
    $('saveBtn').disabled = true; msg('저장 중…');
    api('/api/review?action=save&id=' + current.case.id, { method: 'PUT', body: { version: current.state.version, edits: edits, notes: notes, caseNote: $('caseNote').value, status: $('status').value } })
      .then(function(d){
        if (d.ok) { dirty = false; return openCase(current.case.id, false).then(function(){ msg('저장했습니다 (버전 ' + d.state.version + ').', 'ok'); loadList(); }); }
        msg(d.error || '저장하지 못했습니다.', 'err');
      }).catch(function(){ msg('서버에 연결하지 못했습니다. 수정 내용은 화면에 남아 있으니 다시 저장해 주세요.', 'err'); })
      .then(function(){ $('saveBtn').disabled = false; });
  });

  $('hist').addEventListener('click', function(e){
    var v = e.target.getAttribute('data-restore'); if (!v) return;
    if (!confirm('버전 ' + v + ' 상태로 되돌릴까요? (지금 상태도 이전 버전으로 보관됩니다)')) return;
    api('/api/review?action=restore&id=' + current.case.id, { method: 'POST', body: { targetVersion: Number(v), version: current.state.version } }).then(function(d){
      if (d.ok) openCase(current.case.id, false).then(function(){ msg('버전 ' + v + '으로 복원했습니다.', 'ok'); loadList(); });
      else msg(d.error || '복원하지 못했습니다.', 'err');
    });
  });

  $('importFile').addEventListener('change', function(){
    var f = this.files[0]; if (!f) return;
    f.text().then(function(text){
      var data; try { data = JSON.parse(text); } catch (e) { alert('JSON 파일을 읽지 못했습니다.'); return; }
      if (!confirm((data.items || []).length + '건을 가져올까요? 서버 쪽이 더 최신인 사례는 건너뜁니다.')) return;
      api('/api/review?action=import', { method: 'POST', body: data }).then(function(d){
        alert(d.ok ? d.applied + '건 반영했습니다.' : (d.error || '가져오지 못했습니다.')); loadList();
      });
    });
    this.value = '';
  });

  function showList(){ $('detail').hidden = true; $('listView').hidden = false; $('savebar').hidden = true; msg(''); }
  $('backBtn').addEventListener('click', function(){ if (dirty && !confirm('저장하지 않은 수정이 있습니다. 목록으로 갈까요?')) return; history.pushState({}, '', location.pathname); showList(); });
  window.addEventListener('popstate', function(){ var id = location.hash.slice(1); if (id) openCase(id, false); else showList(); });
  window.addEventListener('beforeunload', function(e){ if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  ['q', 'fCat', 'fStatus', 'onlyTodo'].forEach(function(id){ $(id).addEventListener('input', renderList); $(id).addEventListener('change', renderList); });
  $('list').addEventListener('click', function(e){ var b = e.target.closest('.item'); if (b) openCase(b.getAttribute('data-id')); });

  loadList().then(function(){ var id = location.hash.slice(1); if (id) openCase(id, false); });
})();
</script>
</body>
</html>
